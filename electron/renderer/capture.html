<!doctype html>
<html lang="tr">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Akıllı yakalama</title>
    <link rel="stylesheet" href="capture.css" />
  </head>
  <body>
    <header>
      <div class="capture-mark" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></div>
      <div><small>QUICK ROUTE</small><h1>Akıllı yakalama</h1></div>
      <button id="close" aria-label="Paneli kapat"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg></button>
    </header>
    <main>
      <label for="scan-url">Kopyalanan bağlantı</label>
      <div class="url-row"><input id="scan-url" type="url" placeholder="https://..." /><button id="scan">Tara</button></div>
      <div class="pulse" id="scanning" hidden><i></i><span>Bağlantılar inceleniyor…</span></div>
      <p class="message" id="message">Bir sayfa veya dosya bağlantısını kopyalayıp <kbd>Ctrl Alt D</kbd> tuşlarına bas.</p>
      <section id="results" hidden>
        <div class="result-heading"><b id="result-count">0 öğe</b><button id="toggle-all">Tümünü seç</button></div>
        <div id="items"></div>
      </section>
    </main>
    <footer><span>Yalnızca açık HTTP/HTTPS kaynakları</span><button id="download" disabled>Seçilenleri indir</button></footer>
    <script src="capture.js"></script>
  </body>
</html>
